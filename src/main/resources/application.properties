# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/skillswap
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# App Port
server.port=8080

# App Name
spring.application.name=skillswap-backend

# JWT
# Set JWT_SECRET as an environment variable in real deployments.
app.jwt.secret=${JWT_SECRET:SkillSwap-dev-secret-key-must-be-at-least-32-bytes-long!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
